# CareLink: business timings remain in src/lib/cron-jobs.data.json.
# Existing names retain environment bindings; removed services must be suspended
# (carelink-cron-heartbeat was folded into carelink-health-check; delete that service)
# after the coordinated CARELINK_CRON_DISPATCH_FROM cutover (see docs).

services:
  - type: cron
    name: carelink-webhook-retry
    runtime: node
    region: oregon
    schedule: "*/15 * * * *"
    buildCommand: echo "no build (Node 標準のみ)"
    startCommand: node scripts/cron-dispatch.mjs quarter-hour
    buildFilter:
      paths:
        - scripts/**
        - src/lib/cron-jobs.data.json
        - src/lib/cron-dispatch.mjs
        - src/lib/render-cron.mjs
        - render.yaml
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: carelink-cron-env

  - type: cron
    name: carelink-booking-reminder
    runtime: node
    region: oregon
    schedule: "5,50 * * * *"
    buildCommand: echo "no build (Node 標準のみ)"
    startCommand: node scripts/cron-dispatch.mjs hourly
    buildFilter:
      paths:
        - scripts/**
        - src/lib/cron-jobs.data.json
        - src/lib/cron-dispatch.mjs
        - src/lib/render-cron.mjs
        - render.yaml
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: carelink-cron-env

  - type: cron
    name: carelink-daily-summary
    runtime: node
    region: oregon
    schedule: "0,10,20,25,40 * * * *"
    buildCommand: echo "no build (Node 標準のみ)"
    startCommand: node scripts/cron-dispatch.mjs calendar
    buildFilter:
      paths:
        - scripts/**
        - src/lib/cron-jobs.data.json
        - src/lib/cron-dispatch.mjs
        - src/lib/render-cron.mjs
        - render.yaml
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: carelink-cron-env

  - type: cron
    name: carelink-health-check
    runtime: node
    region: oregon
    # Both monitors share this service (MONITOR_RUNNER in src/lib/cron-dispatch.mjs):
    # the health probe on every tick, cron-heartbeat at its canonical 7,37 slots.
    schedule: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
    buildCommand: echo "no build (Node 標準のみ)"
    startCommand: node scripts/health-check.mjs
    buildFilter:
      paths:
        - scripts/**
        - src/lib/cron-jobs.data.json
        - src/lib/cron-dispatch.mjs
        - src/lib/render-cron.mjs
        - render.yaml
        - package.json
        - package-lock.json
    envVars:
      - fromGroup: carelink-cron-env
      # Slack 通報の資格情報は既存の共有グループから受け取る（値をリポジトリにも
      # carelink-cron-env にも複製しない）。Slack を使うのはこの監視だけなので他の cron には付けない。
      - fromGroup: slack-gyomu-bot
