name: Migration Apply Reminder

# Pillar 3（発症前予防・PR-time gate）:
#   このプロジェクトは DDL を Supabase SQL editor で**手動**適用する運用で、
#   migration は auto-apply されない。migration が main へ merge されただけでは
#   本番スキーマは変わらないため、deploy されたコードが本番に存在しないスキーマへ
#   黙って依存し続ける「静かなドリフト」が起こり得る。
#
#   `schema-drift-check` cron（毎日 JST 02:40）が最終的に 🔴 でこれを検知するが、
#   それは最大 24 時間後。本ワークフローは merge を待たず、PR 作成/更新の**その瞬間**
#   に「これから本番へ手動適用が必要な migration」を PR コメントで人に見せる。
#   cron を置き換えるものではなく、可視化を早める補完（cron は「適用し忘れたまま
#   24時間経った」を検知し続ける最終防衛線として維持）。
#
# 検出ロジックは scripts/detect-added-migrations.mjs（純関数・単体テストあり）に
# 分離している。理由: jest.config.js の collectCoverageFrom は `scripts/**` を含まず
# branches=100% ゲート対象外のため、CI ワークフロー専用の薄いヘルパをここに置くと
# 本体コード（src/lib, src/app/api）と同じ重さのカバレッジ義務を負わずに済む。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: migration-apply-reminder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  remind:
    name: Remind to apply new migrations to prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # base ブランチ(origin/${{ github.base_ref }})との diff を取るため全履歴が要る。
          fetch-depth: 0

      - name: List migration files in base and HEAD trees
        id: diff
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet
          # base ブランチにまだ supabase/migrations/ が無い（極端に古い/特殊な base）
          # 場合に備えて || true で空扱いにする。それ以外の git 側エラーは通常起こらない。
          BASE_LIST="$(git ls-tree -r --name-only "origin/${{ github.base_ref }}" -- supabase/migrations/ || true)"
          HEAD_LIST="$(git ls-tree -r --name-only HEAD -- supabase/migrations/)"
          # 区切りトークンは run_id で一意化する（一覧の中身がたまたま固定文字列と
          # 一致してヒアドキュメントが早期終端する事故を避ける）。
          BASE_DELIM="MIGRATION_BASE_EOF_${GITHUB_RUN_ID}"
          HEAD_DELIM="MIGRATION_HEAD_EOF_${GITHUB_RUN_ID}"
          {
            echo "base-list<<${BASE_DELIM}"
            echo "$BASE_LIST"
            echo "${BASE_DELIM}"
            echo "head-list<<${HEAD_DELIM}"
            echo "$HEAD_LIST"
            echo "${HEAD_DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Detect added migrations and upsert sticky PR comment
        uses: actions/github-script@v7
        env:
          # 🔴 ${{ }} でスクリプト本文へ直接一覧テキストを埋め込まない。
          #   一覧にはブランチ由来の任意文字列（バッククォート・${ 等）が含まれ得るため、
          #   github-script の script: に textual に展開すると script injection になり得る
          #   （actions/github-script の既知の落とし穴）。env 経由で渡し process.env から読む。
          MIGRATION_BASE_LIST: ${{ steps.diff.outputs.base-list }}
          MIGRATION_HEAD_LIST: ${{ steps.diff.outputs.head-list }}
        with:
          script: |
            const { newMigrations } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/detect-added-migrations.mjs`
            );

            const baseList = process.env.MIGRATION_BASE_LIST || '';
            const headList = process.env.MIGRATION_HEAD_LIST || '';
            const added = newMigrations(baseList, headList);

            const MARKER = '<!-- migration-apply-reminder -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // 既存のこのワークフローが作った sticky コメントを探す（見つかった/新規かで later
            // 分岐する。1 PR に対して常に高々 1 件だけを維持し、push の度にスパムしない）。
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.data.find((c) => c.body && c.body.includes(MARKER));

            if (added.length === 0) {
              if (existing) {
                const body = [
                  MARKER,
                  '## 🗄️ Migration 適用リマインダー',
                  '',
                  'この PR に新規 migration はありません（適用不要）。',
                  '',
                  '---',
                  '_Generated by [Claude Code](https://claude.ai/code)_',
                ].join('\n');
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              }
              // 新規 migration が無く、既存コメントも無ければ何もしない。
              return;
            }

            const fileList = added.map((f) => `- \`${f}\``).join('\n');
            const checklist = added.map((f) => `- [ ] \`${f}\``).join('\n');

            const body = [
              MARKER,
              '## 🗄️ Migration 適用リマインダー',
              '',
              `この PR には新規 migration が **${added.length}件** 追加されています:`,
              '',
              fileList,
              '',
              'このプロジェクトは DDL を **Supabase SQL editor で手動適用**する運用です' +
                '（migration は自動適用されません）。',
              'この PR が **main へ merge された後**、上記の migration を SQL editor で',
              '本番 Supabase に適用してください。適用するまでは、デプロイ済みコードが',
              '本番に存在しないスキーマへ依存した状態になります。',
              '',
              '未適用のままだと、日次スキーマドリフト監視（`schema-drift-check`）が',
              '最大24時間後に 🔴 で検知します（誤報ではなく実際の未適用を示します）。',
              '',
              '### 適用チェックリスト',
              checklist,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
