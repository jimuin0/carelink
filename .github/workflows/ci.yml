name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Runtime compile-cache build contract
        run: node --test scripts/warm-runtime-compile-cache.test.mjs scripts/prune-vcr-images.test.mjs scripts/runtime-cpu-sampler.test.cjs scripts/static-asset-cdn-cache.test.cjs scripts/deepmerge-security.test.cjs
      - name: Verify admin schedule export against cron registry
        run: |
          node --test scripts/export-admin-schedules.test.mjs
          node scripts/export-admin-schedules.mjs --check
      - name: Lint
        run: npm run lint
      # React Compiler 系ルール（set-state-in-effect 等）は警告に落としてある。
      # 警告は npm run lint を落とさないので、この検査が無いと負債が黙って増え続ける。
      # 件数がベースラインと厳密一致しなければ失敗する（増加＝退行、減少＝ベースライン更新漏れ）。
      # 判定ロジックは src/lib/react-compiler-debt.mjs（単体テスト済み）。
      - name: React Compiler debt ratchet
        run: npm run lint:debt
      - name: Type Check
        run: npx tsc --noEmit

  unit-test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    # Phase 1.5 で 26 失敗テスト全修復 → 必須ゲートに復帰
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Seed helper destination safety
        run: node --test scripts/local-seed-target.test.mjs
      - name: Run Tests with Coverage
        run: npm run test:coverage:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://fake.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: fake-anon-key
      - name: Coverage Summary
        run: |
          echo "## Test Coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/lcov-report/index.html 2>/dev/null | grep -E "strong|fraction" | head -20 || true
      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Coverage Gate（Lines 80%未満 / Branches 100%未満で失敗）
        run: |
          read -r LINES BRANCHES <<< "$(cat coverage/coverage-summary.json 2>/dev/null | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          total = d.get('total', {})
          lines = total.get('lines', {}).get('pct', 0)
          branches = total.get('branches', {}).get('pct', 0)
          print(lines, branches)
          " 2>/dev/null || echo "0 0")"
          echo "Line coverage: ${LINES}%"
          echo "Branch coverage: ${BRANCHES}%"
          if (( $(echo "$LINES < 80" | bc -l) )); then
            echo "❌ Lineカバレッジが 80% を下回っています: ${LINES}%"
            exit 1
          fi
          # L3: ブランチカバレッジは測定スコープ内で100%を維持（発症前予防の物理ゲート）
          if (( $(echo "$BRANCHES < 100" | bc -l) )); then
            echo "❌ Branchカバレッジが 100% を下回っています: ${BRANCHES}%（L3 退行）"
            exit 1
          fi
          echo "✅ カバレッジ OK: Lines ${LINES}% / Branches ${BRANCHES}%"

  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    # Unit/Contract failures must still block merging, but cannot prevent this
    # independent fresh-apply/Storage gate from producing its evidence. In
    # particular, a new migration awaiting production introspection may fail
    # the committed-type gate; local artifacts are not production evidence.
    needs: [lint-typecheck]
    # PR でも e2e を必須化する（push-main 限定だと e2e 退行のまま PR マージ可能になる盲点）。
    # workflow は push-main と PR-to-main でのみ起動するため、if を外せば両方で走る。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # 既知良好版にピン留め（再現性100%・発症前予防）。
          # `latest` は将来のCLI更新で挙動が変わりうる変動要因。実際 CLI 2.75.0 の
          # マイグレーション文分割器には「引数リスト付き CREATE FUNCTION の直後に別文が
          # 続くファイル」を1チャンク化して 42601(cannot insert multiple commands into a
          # prepared statement) を起こすバグがあり、2.104.0 で修正されていることを
          # ローカル fresh-apply 実測で確認済み。下の `supabase start` ゲートが将来の
          # ピン更新時の退行も検知する二重防御。
          version: 2.104.0
      - name: Pin local PostgREST with correct HEAD connection semantics
        # CLI 2.104.0's v14.12 silently closes HEAD connections, allowing Kong
        # to pool a dead socket and fail the next POST/PATCH with HTTP 502.
        # v14.15 advertises Connection: close (supabase/cli#6674). Keep the
        # tested CLI/parser and replace only this disposable local API image.
        run: |
          mkdir -p supabase/.temp
          printf '%s' 'v14.15' > supabase/.temp/rest-version
      - name: Authenticate image pulls to ghcr.io
        # Authenticated pulls get their own ghcr.io allowance (used by the fallback below).
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Start Supabase (fresh-apply gate)
        # 恒久・発症前予防の中核ゲート。`supabase start` は supabase/migrations/*.sql を
        # 「新規環境へ全 replay（fresh-apply）」する。version 衝突・42P16（View 列改名）・
        # 関数重複（function name is not unique）等で 1 本でも適用失敗すれば、ここで CI が
        # 落ち、e2e 以前に「migration が新規環境で再生不能」というドリフトを検知する。
        # これが従来 fake.supabase.co で握り潰されていた E2E 連鎖失敗の真因（/api/health 503）
        # を根治する: 実 Supabase をローカル起動し本物の DB/anon key を後段へ渡す。
        # Image pulls are rate limited per registry: on 2026-10-23 ghcr.io returned
        # "toomanyrequests" for hours and public.ecr.aws later returned "Data limit
        # exceeded", so no E2E test could start. The same image tags are published to
        # Try authenticated ghcr.io first: public.ecr.aws repeatedly returned
        # Data limit exceeded and spent nine minutes before the fallback worked.
        # Keep both public registries as fallbacks (twice each) before
        # failing. Every attempt still replays all migrations on a fresh database.
        run: |
          for registry in ghcr.io public.ecr.aws docker.io; do
            for attempt in 1 2; do
              if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" supabase start; then
                echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=$registry" >> "$GITHUB_ENV"
                exit 0
              fi
              echo "supabase start failed with $registry (attempt $attempt)" >&2
              supabase stop --no-backup >/dev/null 2>&1 || true
              sleep 20
            done
          done
          exit 1
      - name: Verify local PostgREST HEAD connection semantics
        # Actual headers/socket behavior, not an image-tag-only assertion.
        # No rows, keys, remote URLs, test retries or application replay.
        run: python3 scripts/check-local-postgrest-head.py
      - name: Generate schema types from the disposable local database
        # Schema only, no rows or hosted-project credentials. Keep the artifact
        # independent of later browser assertions so missing types can be fixed
        # from actual introspection rather than guessed by hand.
        run: supabase gen types typescript --local --schema public > "$RUNNER_TEMP/carelink-database.types.ts"
      - name: Upload generated local schema types
        uses: actions/upload-artifact@v4
        with:
          name: local-database-types
          path: ${{ runner.temp }}/carelink-database.types.ts
          if-no-files-found: error
          retention-days: 7
      - name: Export Supabase local credentials
        id: supabase
        # `supabase status -o env` は KEY=VALUE 形式で出力するが、CLI バージョンにより
        # 値がダブルクォートで囲まれる（2.104.0 は API_URL="http://..." とクォート付き、
        # KEY 類はクォートなし）。行頭アンカーで抽出後、前後のダブルクォートを必ず除去する
        # （クォートを残すと NEXT_PUBLIC_SUPABASE_URL='"http://..."' となり
        # supabase-js が "Invalid supabaseUrl" で next build を落とす）。
        run: |
          STATUS=$(supabase status -o env)
          unquote() { sed -E 's/^"//; s/"$//'; }
          API_URL=$(echo "$STATUS" | grep '^API_URL=' | cut -d= -f2- | unquote)
          ANON_KEY=$(echo "$STATUS" | grep '^ANON_KEY=' | cut -d= -f2- | unquote)
          SERVICE_ROLE_KEY=$(echo "$STATUS" | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | unquote)
          # service_role key は /api/health の rate_limit プローブ（createServiceRoleClient →
          # check_rate_limit RPC）が必須とする。欠けると criticalOk=false → 503 になり
          # api-contract.spec.ts の status===200 / 'healthy'|'degraded' 期待が連鎖失敗する。
          if [ -z "$API_URL" ] || [ -z "$ANON_KEY" ] || [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "❌ supabase status から API_URL / ANON_KEY / SERVICE_ROLE_KEY を取得できませんでした"
            exit 1
          fi
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ANON_KEY"
          echo "anon=$ANON_KEY" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "service_role=$SERVICE_ROLE_KEY" >> "$GITHUB_OUTPUT"
      - name: Local Supabase API contracts (no skips)
        # Hosted stagingではなく、全migration fresh-apply後の隔離Supabase実API検証。
        # 生成型とprod migrationの静的照合は既存contract-test jobの必須gateに残す。
        env:
          STAGING_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          STAGING_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role }}
        run: |
          node scripts/check-local-supabase-contract.mjs environment
          npm run test:contract -- --runInBand --runTestsByPath tests/contract/schema-invariants.contract.test.ts tests/contract/supabase-contract.test.ts tests/contract/local-mutation.contract.test.ts --json --outputFile="$RUNNER_TEMP/local-supabase-contract.json"
          node scripts/check-local-supabase-contract.mjs results "$RUNNER_TEMP/local-supabase-contract.json"
          echo "Isolated local Supabase API contracts passed with zero skips. This is not hosted staging or production verification." >> "$GITHUB_STEP_SUMMARY"
      - name: Install Playwright Browsers
        # playwright.config の 2 プロジェクト（chromium / Mobile Safari=webkit）を両方導入。
        # 従来は chromium のみで webkit 系の E2E が実行されない盲点があった。
        # 2026-10-23: apt の取得が 28 分止まり、ジョブ全体の 30 分上限で E2E が 1 本も走らずに
        # 打ち切られた（#795）。依存導入は1回3分で切り、3回まで取り直す。
        # 8分待ちの再試行でも15分を消費したため、E2E本体の30分枠を確保する。
        # root の apt 子プロセスは一般ユーザーの timeout では終了できず、次の試行が
        # dpkg lock で失敗する。依存導入だけを root の timeout 配下で実行する。
        run: |
          playwright_node="$(command -v node)"
          playwright_cli="$PWD/node_modules/playwright/cli.js"
          # This disposable runner owns the configuration; never remove lock
          # files or kill unrelated package-manager processes to recover.
          sudo tee /etc/apt/apt.conf.d/99carelink-ci-network >/dev/null <<'EOF'
          Acquire::Retries "0";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          DPkg::Lock::Timeout "60";
          EOF
          # Azure's regional Ubuntu mirror repeatedly stalled package downloads
          # on fresh runners. Use the official archive with the same suites and
          # signing keys; keep dependency validation and the bounded retries.
          sudo python3 - <<'PYTHON'
          from pathlib import Path
          source_dir = Path('/etc/apt/sources.list.d')
          sources = [Path('/etc/apt/sources.list'), *source_dir.glob('*.sources'), *source_dir.glob('*.list')]
          for source in sources:
              if not source.exists():
                  continue
              original = source.read_text()
              updated = original.replace('http://azure.archive.ubuntu.com', 'https://archive.ubuntu.com').replace('https://azure.archive.ubuntu.com', 'https://archive.ubuntu.com')
              if updated != original:
                  source.write_text(updated)
                  print('Using official Ubuntu archive:', source.name)
          PYTHON
          dependencies_installed=0
          for attempt in 1 2 3; do
            if sudo timeout --kill-after=15s 180 "$playwright_node" "$playwright_cli" install-deps chromium webkit; then
              dependencies_installed=1
              break
            fi
            echo "playwright OS dependencies failed or timed out (attempt $attempt)" >&2
            # A bounded retry may have interrupted package configuration. The
            # root timeout has already terminated its own process group.
            sudo timeout --kill-after=15s 120 dpkg --configure -a
            sleep 10
          done
          test "$dependencies_installed" -eq 1
          for attempt in 1 2 3; do
            if timeout --kill-after=15s 480 "$playwright_node" "$playwright_cli" install chromium webkit; then
              exit 0
            fi
            echo "playwright install failed or timed out (attempt $attempt)" >&2
            sleep 10
          done
          exit 1
      - name: Production Build and HTTPS E2E Tests
        # Browser and server use the same TLS local Supabase origin. In-memory
        # private keys; public CA only for Node trust; no TLS bypass flags.
        run: node scripts/run-ci-e2e.mjs
        env:
          # Disposable DB only. Production remains gated until commit/claim
          # integration and schema/history reconciliation have passed.
          SALON_REGISTRATION_V2_ENABLED: 'true'
          SKIP_ENV_VALIDATION: true
          PLAYWRIGHT_BASE_URL: https://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.anon }}
          # /api/health の rate_limit プローブ（service_role + check_rate_limit RPC）に必須。
          SUPABASE_SERVICE_ROLE_KEY: ${{ steps.supabase.outputs.service_role }}
      - name: Stop Supabase
        if: always()
        run: supabase stop || true
      - name: Upload E2E Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: npm audit（moderate以上の脆弱性チェック）
        # 開発依存も含め moderate 以上を CI で拒否し、既知の脆弱性を取り込まない
        # continue-on-error による握り潰しは行わない。
        run: npm audit --audit-level=moderate
      - name: Critical 脆弱性は失敗させる
        run: |
          CRITICAL=$(npm audit --json 2>/dev/null | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(d.get('metadata', {}).get('vulnerabilities', {}).get('critical', 0))
          " 2>/dev/null || echo "0")
          echo "Critical vulnerabilities: $CRITICAL"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "❌ Critical 脆弱性が検出されました: ${CRITICAL} 件"
            exit 1
          fi
          echo "✅ Critical 脆弱性なし"
      - name: Secrets スキャン（ハードコードされた認証情報を検出）
        run: |
          # 一般的なシークレットパターンをチェック
          if grep -rE "(sk_live_|pk_live_|AKIA[0-9A-Z]{16}|eyJhbGciOiJIUzI1NiJ9)" \
            src/ --include="*.ts" --include="*.tsx" --exclude-dir=node_modules; then
            echo "❌ ハードコードされたシークレットを検出"
            exit 1
          fi
          echo "✅ シークレットスキャン OK"

  pr-comment:
    name: PR Coverage Comment
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    needs: [unit-test]
    if: github.event_name == 'pull_request'
    # PR へのカバレッジコメント投稿には issues/pull_requests への write が必須。
    # 未指定だと GITHUB_TOKEN は read-only で 403 "Resource not accessible by integration"。
    # job-level permissions は未指定スコープを none にするため checkout 用の contents:read も明示。
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage/
        continue-on-error: true
      - name: Comment Coverage on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## テストカバレッジ\n\n';
            try {
              const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = summary.total;
              body += `| 指標 | カバレッジ |\n|------|----------|\n`;
              body += `| Lines | ${total.lines.pct}% (${total.lines.covered}/${total.lines.total}) |\n`;
              body += `| Functions | ${total.functions.pct}% |\n`;
              body += `| Branches | ${total.branches.pct}% |\n`;
              body += `| Statements | ${total.statements.pct}% |\n`;
              const gate = total.lines.pct >= 80 ? '✅' : '❌';
              body += `\n${gate} ゲート基準: Lines 80% 以上`;
            } catch (e) {
              body += '⚠️ カバレッジデータが取得できませんでした';
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  contract-test:
    name: Contract Tests (staging drift gate)
    runs-on: ubuntu-latest
    # 🔴 上限を明示する。GitHub の既定は 6 時間で、外部ダウンロードが停滞すると
    #   1 件のジョブがランナーを 6 時間占有する（2026年8月19日に E2E の
    #   "Install Playwright Browsers" が 5 時間 58 分ハングして実際に起きた）。
    #   上限があれば早く赤くなり、再実行が数分で済む。
    timeout-minutes: 30
    # 本番と repo migration の「静かなドリフト」（RPC 不在 / カラム欠落 / View 未作成 /
    # RLS 過大公開 / 予約 RPC の 0A000 landmine）を発症前に検知する恒久ゲート。
    # staging secrets未設定でも生成型の静的照合は実行。実APIはE2E jobの隔離localで必須。
    # 外部stagingが設定された場合もmutation probeはlocal限定で、本番へは接続しない。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Staging secrets 存在チェック（任意の外部読取検証）
        id: staging
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$STAGING_SUPABASE_URL" ] && [ -z "$STAGING_SUPABASE_ANON_KEY" ] && [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "外部staging未設定：このjobの外部Supabase接続検査は省略。生成型の静的照合は有効、実APIの3 suites/17件はE2E jobの隔離localで必須実行します。" >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "外部テスト成功とは扱いません。" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$STAGING_SUPABASE_URL" ] || [ -z "$STAGING_SUPABASE_ANON_KEY" ] || [ -z "$STAGING_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Staging is partially configured; all three explicit inputs are required."
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "外部staging設定済み：読取12件を実行します。mutation5件は隔離local限定です。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Static migration contracts (required)
        run: npm run test:contract -- --runInBand --runTestsByPath tests/contract/migration-prod-drift.contract.test.ts
      - name: Configured staging read contracts (optional environment, zero skipped tests)
        if: steps.staging.outputs.configured == 'true'
        run: |
          npm run test:contract -- --runInBand --runTestsByPath tests/contract/schema-invariants.contract.test.ts tests/contract/supabase-contract.test.ts --json --outputFile="$RUNNER_TEMP/staging-read-contract.json"
          node scripts/check-local-supabase-contract.mjs read-results "$RUNNER_TEMP/staging-read-contract.json"
        env:
          # staging 専用シークレット（GitHub Secrets 経由・値は repo に書かない）。
          # 未設定時は外部接続検査のみskip。静的照合と別jobのlocal API gateは維持。
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
