# ⚠️ 一時ワークフロー（2026-11-04）。掲載申込の Slack 通知がテスト用チャンネルへ届くかの手動試験。
# 作業ブランチへの push でだけ動く。PR にする前に削除する。
name: Slack notify live check (temporary)

on:
  push:
    branches: [claude/register-visual-20261104]
    paths:
      - .github/workflows/slack-notify-live-check.yml
      - scripts/slack-live-check/**

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: テスト用チャンネルへ送る
        env:
          CARELINK_SLACK_TEST_BOT_CREDENTIAL: ${{ secrets.SLACK_BOT_TOKEN }}
          CARELINK_SLACK_TEST_CHANNEL: C0A8QP9QA9F
        run: npx jest --ci --coverage=false --testMatch '<rootDir>/scripts/slack-live-check/*.live.ts'
