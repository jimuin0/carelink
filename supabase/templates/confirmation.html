<!DOCTYPE html>

<h1>メールアドレスの確認</h1>
<p>CareLinkにご登録いただき、ありがとうございます。</p>
<p>下のリンクを押して、メールアドレスの確認を完了してください。</p>
<p><a href="{{ .ConfirmationURL }}">メールアドレスを確認する</a></p>
<p>掲載申込後に店舗アカウントを作成された場合は、確認後に掲載申込の続きを進めてください。別のブラウザでメールを開いた場合は、申込を進めていたブラウザに戻り、同じメールアドレスでログインしてください。</p>
<p>まだ掲載を申し込んでいない場合は、CareLinkの掲載申込ページからお申し込みください。</p>
<p>このメールに心当たりがない場合は、リンクを押さずに破棄してください。</p>
<p>CareLink運営</p>
</body>
</html>
